[package]
name = "holodeck"
version = "0.1.0"
authors = ["Tim Fennell <tim@fulcrumgenomics.com>"]
description = "Modern NGS read simulator"
repository = "https://github.com/fg-labs/holodeck"
homepage = "https://github.com/fg-labs/holodeck"
license = "MIT"
edition = "2024"
rust-version = "1.94.0"

[lib]
name = "holodeck_lib"
path = "src/lib.rs"

[[bin]]
name = "holodeck"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "wrap_help", "unicode"] }
enum_dispatch = "0.3"
noodles = { version = "0.109", features = ["bam", "fasta", "sam", "bgzf", "core", "vcf"] }
noodles-bgzf = { version = "0.46", features = ["libdeflate"] }
coitrees = "0.4"
anyhow = "1"
thiserror = "2"
log = "0"
env_logger = "0.11"
mimalloc = { version = "0.1", default-features = false }
rand = "0.9"
rand_distr = "0.5"
pooled-writer = "0.4"
flate2 = { version = "1", features = ["zlib-ng"], default-features = false }
bstr = "1"
chrono = "0.4"

[dev-dependencies]
tempfile = "3"
approx = "0.5"

[build-dependencies]
built = { version = "0", features = ["git2"] }

[profile.release]
lto = "fat"
codegen-units = 1
overflow-checks = true
panic = "abort"
